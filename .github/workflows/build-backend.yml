name: Build & Push Backend Image

on:
  push:
    branches: ["dev", "staging", "main"]

  pull_request:
    branches: ["dev", "staging", "main"]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: docker.io
  IMAGE_NAME: jaffleman971/maptdp-backend

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-latest

    steps:

      # ------------------------ CHECKOUT ------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------ SECRET SCAN ------------------------
      - name: Scan secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v2

      # ------------------------ NODE ------------------------
      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # ------------------------ INSTALL & TEST ------------------------
      - name: Install dependencies and run tests
        run: |
          npm ci
          npm test --if-present

      # ------------------------ SECURITY AUDIT ------------------------
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      # ------------------------ DOCKERFILE LINT ------------------------
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile

      # ------------------------ DOCKER SETUP ------------------------
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------ LOGIN DOCKER HUB ------------------------
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------ GENERATE TAG ------------------------
      - name: Generate image tag
        id: tag
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          BRANCH=${GITHUB_REF_NAME}
      
          if [ "$BRANCH" = "dev" ]; then
            PREFIX="dev"
          elif [ "$BRANCH" = "staging" ]; then
            PREFIX="staging"
          elif [ "$BRANCH" = "main" ]; then
            PREFIX="prod"
          else
            echo "Branch not supported: $BRANCH"
            exit 1
          fi
      
          TAG="${PREFIX}-sha-${SHORT_SHA}"
      
          echo "Generated tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # ------------------------ BUILD LOCAL IMAGE ------------------------
      - name: Build Docker image (local for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: local-backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------ TRIVY SCAN ------------------------
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local-backend:scan
          scanners: vuln
          vuln-type: library
          severity: CRITICAL,HIGH
          exit-code: 1

      # ------------------------ BUILD & PUSH ------------------------
      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
