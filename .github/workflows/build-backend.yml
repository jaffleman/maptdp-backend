name: Backend CI/CD

on:
  push:
    branches: ["dev"]

  pull_request:
    branches: ["staging"]
    types: [closed]

permissions:
  contents: write
  pull-requests: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: jaffleman971/maptdp-backend

jobs:

  # ---------------- SECRET SCAN ----------------
  secrets-scan:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2


  # ---------------- INSTALL + TEST ----------------
  test:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install & Test
        run: |
          npm ci
          npm test --if-present -- --watchAll=false


  # ---------------- AUDIT (NON BLOQUANT) ----------------
  audit:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Audit npm
        run: |
          npm audit --audit-level=high || true


  # ---------------- DOCKERFILE LINT ----------------
  docker-lint:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile


  # ---------------- BUILD IMAGE POUR SCAN ----------------
  build-scan:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.vars.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build image
        run: |
          docker build -t local-backend:scan .

      - name: Save image
        run: docker save local-backend:scan -o image.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar


  # ---------------- TRIVY ----------------
  trivy:
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    needs: build-scan

    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Scan image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local-backend:scan
          severity: CRITICAL,HIGH
          exit-code: 0


  # =============================
  # ✅ BUILD FINAL + PUSH
  # =============================

  build:
    if: github.ref_name == 'dev'
    needs:
      - secrets-scan
      - test
      - audit
      - docker-lint
      - trivy
    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.vars.outputs.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract SHA
        id: vars
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-sha-${{ steps.vars.outputs.sha }}


  # ---------------- PR AUTO ----------------
  create-pr:
    if: github.ref_name == 'dev'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Create PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: 'dev',
              base: 'staging',
              state: 'open'
            });

            if (prs.length === 0) {
              await github.rest.pulls.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Promote dev → staging',
                head: 'dev',
                base: 'staging',
                body: 'Auto promotion ✅'
              });
            } else {
              console.log("PR already exists");
            }


  # ---------------- RETAG STAGING ----------------
  retag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Extract SHA
        id: vars
        run: echo "sha=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Login Docker
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull dev image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-sha-${{ steps.vars.outputs.sha }}

      - name: Retag
        run: |
          docker tag \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-sha-${{ steps.vars.outputs.sha }} \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-sha-${{ steps.vars.outputs.sha }}

      - name: Push staging image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-sha-${{ steps.vars.outputs.sha }}