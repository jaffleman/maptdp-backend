name: Build & Push Backend Image (Docker Hub)

on:
  push:
    # branches: [ "main" ]
    paths:
      - "apps/backend/**"
      - ".github/workflows/build-backend.yml"

  pull_request:
    branches: [ "main" ]
    paths:
      - "apps/backend/**"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: docker.io
  IMAGE_NAME: jaffleman971/maptdp-backend

jobs:
  build:
    name: Build backend
    runs-on: ubuntu-latest

    steps:

      # ------------------------ CHECKOUT ------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------ DETECT CHANGES ------------------------
      # Remplace git diff HEAD~1
      # Gère correctement :
      # - premier commit
      # - pull requests
      # - merge commits
      - name: Detect backend changes
        id: changes
        uses: tj-actions/changed-files@v46
        with:
          files: |
            apps/backend/**
            .github/workflows/build-backend.yml

      # ------------------------ SECRET SCAN ------------------------
      - name: Scan secrets with Gitleaks
        if: steps.changes.outputs.any_changed == 'true' || github.event_name == 'pull_request'
        uses: gitleaks/gitleaks-action@v2

      # ------------------------ NODE ------------------------
      - name: Use Node 24
        if: steps.changes.outputs.any_changed == 'true' || github.event_name == 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json

      # ------------------------ INSTALL & TEST ------------------------
      - name: Install dependencies and run tests
        if: steps.changes.outputs.any_changed == 'true' || github.event_name == 'pull_request'
        working-directory: apps/backend
        run: |
          npm ci
          npm test --if-present

      # ------------------------ NPM AUDIT ------------------------
      - name: Audit npm dependencies
        if: steps.changes.outputs.any_changed == 'true' || github.event_name == 'pull_request'
        working-directory: apps/backend
        run: npm audit --audit-level=high

      # ------------------------ DOCKERFILE LINT ------------------------
      - name: Lint Dockerfile
        if: steps.changes.outputs.any_changed == 'true' || github.event_name == 'pull_request'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./apps/backend/Dockerfile

      # ------------------------ DOCKER SETUP ------------------------
      - name: Set up QEMU
        if: steps.changes.outputs.any_changed == 'true' || github.event_name == 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.changes.outputs.any_changed == 'true' || github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v3

      # ------------------------ LOGIN DOCKER HUB ------------------------
      - name: Login Docker Hub
        if: steps.changes.outputs.any_changed == 'true' || github.event_name == 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------ DOCKER METADATA ------------------------
      - name: Extract Docker metadata
        if: steps.changes.outputs.any_changed == 'true' || github.event_name == 'pull_request'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      # ------------------------ BUILD LOCAL IMAGE ------------------------
      # Build local pour scan Trivy avant push
      - name: Build Docker image
        if: steps.changes.outputs.any_changed == 'true' || github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile
          load: true
          push: false
          tags: local-backend:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------ TRIVY SCAN ------------------------
      - name: Scan Docker image with Trivy
        if: steps.changes.outputs.any_changed == 'true' || github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: local-backend:scan
          scanners: vuln
          vuln-type: library
          severity: CRITICAL,HIGH
          exit-code: 1

      # ------------------------ BUILD & PUSH MULTIARCH ------------------------
      - name: Build and push Docker image
        if: github.event_name != 'pull_request' && steps.changes.outputs.any_changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/backend
          file: ./apps/backend/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          tags: ${{ steps.meta.outputs.tags }}

          cache-from: type=gha
